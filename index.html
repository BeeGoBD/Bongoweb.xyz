<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#AB55F7" />
    <meta name="msapplication-TileColor" content="#AB55F7" />

    <!-- Favicon & Touch Icons for Every Browser, Tab & Device on the Internet -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/svg+xml" href="/bongoweb-logo.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- SEO Meta Tags -->
    <title>BongoWeb — Premium Website Solutions &amp; Online Catalog</title>
    <meta name="description" content="Explore verified e-commerce, restaurant, blogging, and grocery websites with 24-hour setup, live demos, automated bKash/Nagad checkout, and 24/7 dedicated support." />
    <meta name="keywords" content="BongoWeb, ready made website, ecommerce website Bangladesh, restaurant online menu, bKash automated payment, courier sync, verified website catalog" />
    <meta name="author" content="BongoWeb" />

    <!-- OpenGraph Social Share Card (Facebook, WhatsApp, LinkedIn, Discord, Telegram, iMessage) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BongoWeb" />
    <meta property="og:title" content="BongoWeb — Premium Website Solutions &amp; Online Catalog" />
    <meta property="og:description" content="Explore verified e-commerce, restaurant, blogging, and grocery websites with 24-hour setup, live demos, automated bKash/Nagad checkout, and 24/7 dedicated support." />
    <meta property="og:image" content="/og-image.svg" />
    <meta property="og:image:secure_url" content="/og-image.svg" />
    <meta property="og:image:type" content="image/svg+xml" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BongoWeb Official Logo &amp; Website Solutions" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BongoWeb — Premium Website Solutions &amp; Online Catalog" />
    <meta name="twitter:description" content="Explore verified e-commerce, restaurant, blogging, and grocery websites with 24-hour setup, live demos, automated bKash/Nagad checkout, and 24/7 dedicated support." />
    <meta name="twitter:image" content="/og-image.svg" />
    <meta name="twitter:image:alt" content="BongoWeb Official Logo" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data for Search Engines Crawlers -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://bongoweb.xyz/#organization",
          "name": "BongoWeb",
          "url": "https://bongoweb.xyz",
          "logo": {
            "@type": "ImageObject",
            "url": "https://bongoweb.xyz/bongoweb-logo.svg",
            "width": "460",
            "height": "120"
          },
          "image": "https://bongoweb.xyz/og-image.svg",
          "description": "Premium business website catalog, custom web development, and instant deployment solutions."
        },
        {
          "@type": "WebApplication",
          "@id": "https://bongoweb.xyz/#webapp",
          "name": "BongoWeb — Premium Website Solutions",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "All",
          "browserRequirements": "Requires JavaScript. Requires HTML5.",
          "description": "Explore verified e-commerce, restaurant, blogging, and grocery websites with 24-hour setup and 24/7 support.",
          "offers": {
            "@type": "Offer",
            "price": "990",
            "priceCurrency": "BDT"
          }
        }
      ]
    }
    </script>
  </head>
  <body class="font-sans antialiased text-[#0D253D] bg-[#FFFFFF] selection:bg-[#EEF2FF] selection:text-[#2B47EE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
