<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background rounded squircle with subtle luxury glow -->
    <linearGradient id="favBg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="favFlameGrad" x1="20" y1="10" x2="95" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="25%" stop-color="#8B5CF6" />
      <stop offset="55%" stop-color="#4F46E5" />
      <stop offset="80%" stop-color="#2B47EE" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="favRibbonGrad" x1="15" y1="30" x2="80" y2="105" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="35%" stop-color="#7C3AED" />
      <stop offset="70%" stop-color="#3B52E8" />
      <stop offset="100%" stop-color="#253BD9" />
    </linearGradient>
    <linearGradient id="favBorderGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#2B47EE" stop-opacity="0.3" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2B47EE" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- High-contrast dark container for browser tab visibility -->
  <rect width="128" height="128" rx="28" fill="url(#favBg)" />
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="url(#favBorderGrad)" stroke-width="2" fill="none" />

